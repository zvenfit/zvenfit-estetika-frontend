name: Check upstream parity

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve zvenfit-frontend main
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN || github.token }}
          UPSTREAM_REPOSITORY: zvenfit/zvenfit-frontend
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${UPSTREAM_REPOSITORY}/commits/main")"
          sha="$(node -e 'const data=JSON.parse(process.argv[1]); process.stdout.write(data.sha || "")' "$response")"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Unable to resolve upstream SHA" >&2
            exit 1
          fi
          echo "UPSTREAM_HEAD_SHA=${sha}" >> "$GITHUB_ENV"

      - name: Require an audit for new upstream commits
        run: node scripts/check-upstream-parity.cjs
