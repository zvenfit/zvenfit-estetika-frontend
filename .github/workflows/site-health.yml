name: Site health

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        id: node
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check public TLS certificate
        run: node scripts/check-site-certificate.cjs
      - name: Check CDN response headers
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node scripts/smoke-production.cjs --headers-only
