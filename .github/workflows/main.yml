name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  S3_BUCKET: 'zvenfit-estetika-frontend'
  FUNCTION_NAME: 'zvenfit-estetika-telegram-lead'
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  ALLOWED_ORIGINS: 'https://estetika.zvenfit.ru,https://www.estetika.zvenfit.ru'
  LOG_LEVEL: 'info'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/telegram-lead/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions/telegram-lead

      - name: Run linters and Cloud Function tests
        run: |
          npm run lint:public
          npm run test:lead-fn
          npm run test:monitoring

      - name: Verify static production build
        env:
          LEAD_API_URL: https://example.invalid/lead
          YANDEX_METRIKA_ID: '123456'
          ASSET_VERSION: ci-${{ github.run_number }}
          SITE_URL: https://estetika.zvenfit.ru
        run: npm run test:build

  deploy-function:
    needs: quality-checks
    runs-on: ubuntu-latest
    environment: production
    outputs:
      function_url: ${{ steps.get-url.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install lead function dependencies
        run: npm ci --prefix functions/telegram-lead

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authenticate with service account
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_JSON_KEY }}
        run: |
          echo "$YC_SA_KEY" > /tmp/sa-key.json
          yc config profile create ci-profile
          yc config set service-account-key /tmp/sa-key.json
          yc config set folder-id ${{ env.YC_FOLDER_ID }}
          rm /tmp/sa-key.json

      - name: Deploy Cloud Function
        env:
          NODE_ENV: production
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEAD_RATE_LIMIT_SECRET: ${{ secrets.LEAD_RATE_LIMIT_SECRET }}
          ALLOWED_ORIGINS: ${{ env.ALLOWED_ORIGINS }}
          YC_LEAD_SERVICE_ACCOUNT_ID: ${{ vars.YC_LEAD_SERVICE_ACCOUNT_ID }}
          YDB_DATABASE_NAME: ${{ vars.YDB_DATABASE_NAME || 'zvenfit-estetika-leads' }}
          YDB_SUBMISSIONS_TABLE: ${{ vars.YDB_SUBMISSIONS_TABLE || 'submissions' }}
          YDB_RATE_LIMITS_TABLE: ${{ vars.YDB_RATE_LIMITS_TABLE || 'submission_rate_limits' }}
          LEAD_RATE_LIMIT_MAX: ${{ vars.LEAD_RATE_LIMIT_MAX || '5' }}
          LEAD_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.LEAD_RATE_LIMIT_WINDOW_SECONDS || '600' }}
          MAX_TELEGRAM_ATTEMPTS: ${{ vars.MAX_TELEGRAM_ATTEMPTS || '12' }}
          TELEGRAM_RETRY_BATCH_SIZE: ${{ vars.TELEGRAM_RETRY_BATCH_SIZE || '5' }}
          TELEGRAM_TIMEOUT_MS: ${{ vars.TELEGRAM_TIMEOUT_MS || '15000' }}
          YC_LEAD_TIMEOUT: ${{ vars.YC_LEAD_TIMEOUT || '120s' }}
          YDB_QUERY_TIMEOUT_MS: ${{ vars.YDB_QUERY_TIMEOUT_MS || '5000' }}
          YDB_SLOW_OPERATION_MS: ${{ vars.YDB_SLOW_OPERATION_MS || '1000' }}
          YDB_SESSION_POOL_SIZE: ${{ vars.YDB_SESSION_POOL_SIZE || '5' }}
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
        run: bash scripts/deploy-telegram-lead.sh

      - name: Get function URL
        id: get-url
        run: |
          URL=$(yc serverless function get --name="${FUNCTION_NAME}" --format=json | jq -r '.http_invoke_url // empty')
          if [ -z "$URL" ]; then
            echo "ERROR: Failed to get function URL" >&2
            exit 1
          fi
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Function URL: ${URL}"

  deploy-site:
    runs-on: ubuntu-latest
    needs: [deploy-function]
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          LEAD_API_URL: ${{ needs.deploy-function.outputs.function_url }}
          YANDEX_METRIKA_ID: ${{ vars.YANDEX_METRIKA_ID }}
          ASSET_VERSION: ${{ vars.ASSET_VERSION || github.run_number }}
          SITE_URL: https://estetika.zvenfit.ru
        run: |
          if [ -z "$LEAD_API_URL" ]; then
            echo "ERROR: LEAD_API_URL is empty" >&2
            exit 1
          fi
          npm run build
          node scripts/check-build.cjs
          node scripts/check-performance-budget.cjs

      - name: Upload immutable assets to Yandex Object Storage
        uses: docker://amazon/aws-cli:2.25.1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_REGION: ru-1
          AWS_ENDPOINT_URL: https://storage.yandexcloud.net
        with:
          args: >
            s3 sync ./dist s3://${{ env.S3_BUCKET }}
            --delete
            --exclude "*.html"
            --exclude "robots.txt"
            --exclude "sitemap.xml"
            --cache-control "public, max-age=31536000, immutable"
            --metadata-directive REPLACE

      - name: Upload crawl metadata (no-cache)
        uses: docker://amazon/aws-cli:2.25.1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_REGION: ru-1
          AWS_ENDPOINT_URL: https://storage.yandexcloud.net
        with:
          args: >
            s3 sync ./dist s3://${{ env.S3_BUCKET }}
            --delete
            --exclude "*"
            --include "robots.txt"
            --include "sitemap.xml"
            --cache-control "no-cache, must-revalidate"
            --metadata-directive REPLACE

      - name: Upload HTML (no-cache)
        uses: docker://amazon/aws-cli:2.25.1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_REGION: ru-1
          AWS_ENDPOINT_URL: https://storage.yandexcloud.net
        with:
          args: >
            s3 sync ./dist s3://${{ env.S3_BUCKET }}
            --delete
            --exclude "*"
            --include "*.html"
            --cache-control "no-cache, must-revalidate"
            --metadata-directive REPLACE
